<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Changing the packed axis between ADI sweeps</title>
  <desc id="desc">Three stages show x, y, and z line solves. The recurrence direction changes at each stage while a different independent grid axis supplies the SIMD lanes.</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff;stroke:#d0d7de}.panel{fill:#f6f8fa;stroke:#d0d7de}.ink{fill:#1f2328}.muted{fill:#57606a}.axis{stroke-width:6;stroke-linecap:round}.x{stroke:#cb3c33}.y{stroke:#389826}.z{stroke:#4063d8}.pack{fill:#e3a008;opacity:.22;stroke:#e3a008;stroke-width:2}.stage{animation:stage 6s infinite}.s2{animation-delay:-2s}.s3{animation-delay:-4s}text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px}.heading{font-size:19px;font-weight:700}.big{font-size:17px;font-weight:700}
    @keyframes stage{0%,30%{opacity:1}33%,100%{opacity:.32}}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.panel{fill:#161b22;stroke:#30363d}.ink{fill:#f0f6fc}.muted{fill:#9da7b3}}
    @media(prefers-reduced-motion:reduce){.stage{animation:none;opacity:1}}
  </style>
  <rect class="bg" x="1" y="1" width="958" height="428" rx="8"/>
  <text class="heading ink" x="28" y="36">ADI: repack the data, reuse the solver</text>
  <text class="muted" x="28" y="60">The kernel always walks its first local dimension; the physical meaning is chosen by layout.</text>
  <g class="stage s1" transform="translate(28 92)">
    <rect class="panel" width="282" height="294" rx="7"/><text class="big ink" x="18" y="34">1 · solve x-lines</text>
    <g transform="translate(72 150)"><line class="axis x" x1="0" y1="0" x2="140" y2="0"/><line class="axis y" x1="0" y1="0" x2="0" y2="-70"/><line class="axis z" x1="0" y1="0" x2="55" y2="50"/><rect class="pack" x="-16" y="-84" width="32" height="104" rx="5"/></g>
    <text class="ink" x="18" y="232">recurrence: x</text><text class="ink" x="18" y="254">SIMD lanes: y</text><text class="muted" x="18" y="278">instance shape: (nx, nz)</text>
  </g>
  <g class="stage s2" transform="translate(339 92)">
    <rect class="panel" width="282" height="294" rx="7"/><text class="big ink" x="18" y="34">2 · solve y-lines</text>
    <g transform="translate(72 150)"><line class="axis x" x1="0" y1="0" x2="140" y2="0"/><line class="axis y" x1="0" y1="0" x2="0" y2="-70"/><line class="axis z" x1="0" y1="0" x2="55" y2="50"/><rect class="pack" x="-12" y="-16" width="172" height="32" rx="5"/></g>
    <text class="ink" x="18" y="232">recurrence: y</text><text class="ink" x="18" y="254">SIMD lanes: x</text><text class="muted" x="18" y="278">instance shape: (ny, nz)</text>
  </g>
  <g class="stage s3" transform="translate(650 92)">
    <rect class="panel" width="282" height="294" rx="7"/><text class="big ink" x="18" y="34">3 · solve z-lines</text>
    <g transform="translate(72 150)"><line class="axis x" x1="0" y1="0" x2="140" y2="0"/><line class="axis y" x1="0" y1="0" x2="0" y2="-70"/><line class="axis z" x1="0" y1="0" x2="55" y2="50"/><rect class="pack" x="-9" y="-7" width="83" height="34" rx="5" transform="rotate(42)"/></g>
    <text class="ink" x="18" y="232">recurrence: z</text><text class="ink" x="18" y="254">SIMD lanes: x or y</text><text class="muted" x="18" y="278">instance shape: (nz, other)</text>
  </g>
</svg>
