<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">The three diagonals of a tridiagonal linear system</title>
  <desc id="desc">The main diagonal d is blue, the upper diagonal u is red, and the lower diagonal l is green. Forward elimination moves downward and back substitution moves upward.</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff;stroke:#d0d7de}.panel{fill:#f6f8fa;stroke:#d0d7de}.ink{fill:#1f2328}.muted{fill:#57606a}
    .diag{fill:#4063d8}.upper{fill:#cb3c33}.lower{fill:#389826}.zero{fill:#8c959f}.bracket,.arrow{fill:none;stroke:#57606a;stroke-width:2}.arrow{marker-end:url(#arrow)}
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}.heading{font-size:20px;font-weight:700}.entry{fill:#fff;font-weight:700;text-anchor:middle}.label{font-size:14px;font-weight:650}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.panel{fill:#161b22;stroke:#30363d}.ink{fill:#f0f6fc}.muted{fill:#9da7b3}.bracket,.arrow{stroke:#9da7b3}}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8c959f"/></marker>
  </defs>
  <rect class="bg" x="1" y="1" width="958" height="428" rx="8"/>
  <text class="heading ink" x="28" y="38">Thomas follows the two dependency directions of A</text>
  <text class="muted" x="28" y="63">Only three diagonals are stored; no row can overtake the preceding row in either sweep.</text>

  <rect class="panel" x="92" y="91" width="568" height="286" rx="8"/>
  <path class="bracket" d="M138 116h-13v236h13M615 116h13v236h-13"/>

  <g transform="translate(180 126)">
    <g class="diag">
      <rect x="0" y="0" width="48" height="38" rx="5"/><rect x="70" y="48" width="48" height="38" rx="5"/>
      <rect x="140" y="96" width="48" height="38" rx="5"/><rect x="280" y="192" width="48" height="38" rx="5"/>
    </g>
    <g class="upper">
      <rect x="70" y="0" width="48" height="38" rx="5"/><rect x="140" y="48" width="48" height="38" rx="5"/>
      <rect x="210" y="96" width="48" height="38" rx="5"/><rect x="280" y="144" width="48" height="38" rx="5"/>
    </g>
    <g class="lower">
      <rect x="0" y="48" width="48" height="38" rx="5"/><rect x="70" y="96" width="48" height="38" rx="5"/>
      <rect x="140" y="144" width="48" height="38" rx="5"/><rect x="210" y="192" width="48" height="38" rx="5"/>
    </g>
    <g class="entry">
      <text x="24" y="25">d₁</text><text x="94" y="25">u₁</text>
      <text x="24" y="73">l₂</text><text x="94" y="73">d₂</text><text x="164" y="73">u₂</text>
      <text x="94" y="121">l₃</text><text x="164" y="121">d₃</text><text x="234" y="121">u₃</text>
      <text x="164" y="169">⋱</text><text x="234" y="169">⋱</text><text x="304" y="169">uₙ₋₁</text>
      <text x="234" y="217">lₙ</text><text x="304" y="217">dₙ</text>
    </g>
    <g class="zero">
      <text x="164" y="25">0</text><text x="234" y="25">⋯</text><text x="304" y="25">0</text>
      <text x="234" y="73">⋱</text><text x="304" y="73">⋮</text><text x="24" y="121">0</text>
      <text x="24" y="169">⋮</text><text x="94" y="169">⋱</text><text x="24" y="217">0</text><text x="94" y="217">⋯</text>
    </g>
  </g>

  <text class="ink" x="680" y="231" font-size="24">×</text>
  <path class="bracket" d="M725 116h-11v236h11M777 116h11v236h-11"/>
  <g class="ink" text-anchor="middle"><text x="751" y="146">x₁</text><text x="751" y="194">x₂</text><text x="751" y="242">x₃</text><text x="751" y="290">⋮</text><text x="751" y="338">xₙ</text></g>
  <text class="ink" x="805" y="231" font-size="24">=</text>
  <path class="bracket" d="M850 116h-11v236h11M902 116h11v236h-11"/>
  <g class="ink" text-anchor="middle"><text x="876" y="146">b₁</text><text x="876" y="194">b₂</text><text x="876" y="242">b₃</text><text x="876" y="290">⋮</text><text x="876" y="338">bₙ</text></g>

  <path class="arrow" d="M50 137v179"/><text class="label muted" x="36" y="229" text-anchor="middle" transform="rotate(-90 36 229)">forward elimination</text>
  <path class="arrow" d="M81 316V137"/><text class="label muted" x="79" y="399">back substitution</text>
  <g class="label"><circle class="diag" cx="266" cy="405" r="6"/><text class="ink" x="278" y="410">main d</text><circle class="upper" cx="388" cy="405" r="6"/><text class="ink" x="400" y="410">upper u</text><circle class="lower" cx="512" cy="405" r="6"/><text class="ink" x="524" y="410">lower l</text></g>
</svg>
