<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">One scalar recurrence compared with four recurrences executed in SIMD lockstep</title>
  <desc id="desc">The left panel processes four independent chains one after another. The right panel advances the same four chains together, one vector operation per recurrence step.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill:#ffffff; stroke:#d0d7de; }
    .panel { fill:#f6f8fa; stroke:#d0d7de; }
    .ink { fill:#1f2328; }
    .muted { fill:#57606a; }
    .edge { stroke:#8c959f; stroke-width:2; }
    .node { fill:#ffffff; stroke:#8c959f; stroke-width:1.5; }
    .active { fill:#4063d8; stroke:#2d4fb8; }
    .lane { fill:#389826; opacity:.18; }
    .runner { fill:#cb3c33; }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; }
    .heading { font-size:19px; font-weight:700; }
    .small { font-size:12px; }
    .scalar-run { animation: scalarMove 8s linear infinite; }
    .vector-run { animation: vectorMove 2s steps(5,end) infinite; }
    @keyframes scalarMove {
      0% { transform:translate(0,0); }
      24.9% { transform:translate(235px,0); }
      25% { transform:translate(0,62px); }
      49.9% { transform:translate(235px,62px); }
      50% { transform:translate(0,124px); }
      74.9% { transform:translate(235px,124px); }
      75% { transform:translate(0,186px); }
      100% { transform:translate(235px,186px); }
    }
    @keyframes vectorMove {
      from { transform:translateX(0); }
      to { transform:translateX(235px); }
    }
    @media (prefers-color-scheme:dark) {
      .bg { fill:#0d1117; stroke:#30363d; }
      .panel { fill:#161b22; stroke:#30363d; }
      .ink { fill:#f0f6fc; }
      .muted { fill:#9da7b3; }
      .node { fill:#0d1117; stroke:#6e7681; }
      .edge { stroke:#6e7681; }
    }
    @media (prefers-reduced-motion:reduce) {
      .scalar-run,.vector-run { animation:none; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="958" height="418" rx="8"/>
  <text class="heading ink" x="28" y="36">The recurrence wall</text>
  <text class="muted" x="28" y="60">Dependency stays within a chain; independence exists across chains.</text>

  <rect class="panel" x="28" y="82" width="420" height="302" rx="7"/>
  <text class="heading ink" x="48" y="113">Scalar: one chain at a time</text>
  <text class="small muted" x="48" y="135">The next sample waits for the previous sample.</text>
  <g transform="translate(125 168)">
    <g class="edge">
      <path d="M0 0H235"/><path d="M0 62H235"/><path d="M0 124H235"/><path d="M0 186H235"/>
    </g>
    <g class="node">
      <circle cx="0" cy="0" r="9"/><circle cx="47" cy="0" r="9"/><circle cx="94" cy="0" r="9"/><circle cx="141" cy="0" r="9"/><circle cx="188" cy="0" r="9"/><circle cx="235" cy="0" r="9"/>
      <circle cx="0" cy="62" r="9"/><circle cx="47" cy="62" r="9"/><circle cx="94" cy="62" r="9"/><circle cx="141" cy="62" r="9"/><circle cx="188" cy="62" r="9"/><circle cx="235" cy="62" r="9"/>
      <circle cx="0" cy="124" r="9"/><circle cx="47" cy="124" r="9"/><circle cx="94" cy="124" r="9"/><circle cx="141" cy="124" r="9"/><circle cx="188" cy="124" r="9"/><circle cx="235" cy="124" r="9"/>
      <circle cx="0" cy="186" r="9"/><circle cx="47" cy="186" r="9"/><circle cx="94" cy="186" r="9"/><circle cx="141" cy="186" r="9"/><circle cx="188" cy="186" r="9"/><circle cx="235" cy="186" r="9"/>
    </g>
    <text class="muted" x="-55" y="5">job 1</text><text class="muted" x="-55" y="67">job 2</text>
    <text class="muted" x="-55" y="129">job 3</text><text class="muted" x="-55" y="191">job 4</text>
    <circle class="runner scalar-run" cx="0" cy="0" r="11"/>
  </g>

  <rect class="panel" x="476" y="82" width="456" height="302" rx="7"/>
  <text class="heading ink" x="496" y="113">DLI: four chains in SIMD lockstep</text>
  <text class="small muted" x="496" y="135">Each scalar-looking operation advances one value in every lane.</text>
  <g transform="translate(590 168)">
    <rect class="lane vector-run" x="-16" y="-20" width="32" height="226" rx="6"/>
    <g class="edge">
      <path d="M0 0H235"/><path d="M0 62H235"/><path d="M0 124H235"/><path d="M0 186H235"/>
    </g>
    <g class="active">
      <circle cx="0" cy="0" r="9"/><circle cx="47" cy="0" r="9"/><circle cx="94" cy="0" r="9"/><circle cx="141" cy="0" r="9"/><circle cx="188" cy="0" r="9"/><circle cx="235" cy="0" r="9"/>
      <circle cx="0" cy="62" r="9"/><circle cx="47" cy="62" r="9"/><circle cx="94" cy="62" r="9"/><circle cx="141" cy="62" r="9"/><circle cx="188" cy="62" r="9"/><circle cx="235" cy="62" r="9"/>
      <circle cx="0" cy="124" r="9"/><circle cx="47" cy="124" r="9"/><circle cx="94" cy="124" r="9"/><circle cx="141" cy="124" r="9"/><circle cx="188" cy="124" r="9"/><circle cx="235" cy="124" r="9"/>
      <circle cx="0" cy="186" r="9"/><circle cx="47" cy="186" r="9"/><circle cx="94" cy="186" r="9"/><circle cx="141" cy="186" r="9"/><circle cx="188" cy="186" r="9"/><circle cx="235" cy="186" r="9"/>
    </g>
    <text class="muted" x="-55" y="5">lane 1</text><text class="muted" x="-55" y="67">lane 2</text>
    <text class="muted" x="-55" y="129">lane 3</text><text class="muted" x="-55" y="191">lane 4</text>
  </g>
</svg>

