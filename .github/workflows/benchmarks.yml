name: Cross-platform benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * 6'

# Benchmark numbers are reports, not pass/fail gates. Hosted runners are shared
# machines, so timing noise must never prevent a merge.
permissions:
  contents: read

# The benchmark commands are piped through `tee`.  GitHub's implicit shell is
# `bash -e`, which otherwise reports the status of `tee` instead of a failed
# Julia process.  Explicit bash enables `pipefail` for trustworthy results.
defaults:
  run:
    shell: bash

jobs:
  cpu-linux:
    name: CPU benchmark / Linux x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate benchmark environment
        run: julia --project=bench -e 'using Pkg; Pkg.instantiate()'
      - name: Run CPU benchmark suite
        env:
          JULIA_NUM_THREADS: 2
        run: |
          julia --project=bench -t 2 bench/runall.jl | tee linux-cpu.txt
          cat linux-cpu.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: interleave-linux-cpu
          path: linux-cpu.txt

  cpu-metal:
    name: CPU + Metal benchmark / macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate CPU benchmark environment
        run: julia --project=bench -e 'using Pkg; Pkg.instantiate()'
      - name: Run CPU benchmark suite on Apple Silicon
        env:
          JULIA_NUM_THREADS: 2
        run: |
          julia --project=bench -t 2 bench/runall.jl | tee macos-cpu.txt
          cat macos-cpu.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Instantiate Metal environment
        run: julia --project=gpu/metal -e 'using Pkg; Pkg.instantiate()'
      - name: Run resident Metal benchmark
        run: |
          julia --project=gpu/metal gpu/metal/thomas.jl | tee macos-metal.txt
      - name: Run all KernelAbstractions kernels on Metal
        run: |
          julia --project=gpu/metal gpu/metal/all.jl | tee macos-metal-all.txt
          cat macos-metal.txt macos-metal-all.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: interleave-macos-cpu-metal
          path: |
            macos-cpu.txt
            macos-metal.txt
            macos-metal-all.txt

  # GitHub's standard hosted runners do not expose a GPU.  These two jobs are
  # therefore opt-in: set the repository variable to the *runner name or label*
  # configured by the organization.  An unset variable makes the job skipped,
  # rather than pretending that a CPU runner measured GPU throughput.
  ka-nvidia:
    name: KernelAbstractions benchmark / NVIDIA CUDA
    if: ${{ vars.INTERLEAVE_NVIDIA_RUNNER != '' }}
    runs-on: ${{ vars.INTERLEAVE_NVIDIA_RUNNER }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate CUDA environment
        run: julia --project=gpu/cuda -e 'using Pkg; Pkg.instantiate()'
      - name: NVIDIA device information
        run: nvidia-smi
      - name: Run KernelAbstractions CUDA benchmark suite
        env:
          INTERLEAVE_KA_BACKEND: cuda
        run: |
          julia --project=gpu/cuda gpu/ka/all.jl | tee nvidia-cuda.txt
          cat nvidia-cuda.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: interleave-nvidia-cuda
          path: nvidia-cuda.txt

  ka-amd:
    name: KernelAbstractions benchmark / AMDGPU ROCm
    if: ${{ vars.INTERLEAVE_AMD_RUNNER != '' }}
    runs-on: ${{ vars.INTERLEAVE_AMD_RUNNER }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Instantiate AMDGPU environment
        run: julia --project=gpu/amd -e 'using Pkg; Pkg.instantiate()'
      - name: AMD device information
        run: |
          rocminfo
          rocm-smi || true
      - name: Run KernelAbstractions AMDGPU benchmark suite
        env:
          INTERLEAVE_KA_BACKEND: amdgpu
        run: |
          julia --project=gpu/amd gpu/ka/all.jl | tee amd-rocm.txt
          cat amd-rocm.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: interleave-amd-rocm
          path: amd-rocm.txt
